<!DOCTYPE html>
<html lang="zh-Hant">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>神級人生逆襲系統</title>


  <style>

    * {
      box-sizing: border-box;
    }


    body {
      margin: 0;
      padding: 0;

      font-family:
        "Noto Sans TC",
        Arial,
        sans-serif;

      background:
        #0f1117;

      color:
        #ffffff;
    }


    button,
    input,
    select {
      font-family: inherit;
    }


    button {
      cursor: pointer;
    }


    .container {
      width: min(1200px, 94%);
      margin: 0 auto;
    }


    /* ==============================
       登入
    ============================== */

    #auth-section {
      min-height: 100vh;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 30px;
    }


    .auth-card {
      width: 100%;
      max-width: 420px;

      padding: 35px;

      background: #181c26;

      border:
        1px solid #2c3342;

      border-radius: 18px;

      box-shadow:
        0 15px 50px rgba(0,0,0,.35);
    }


    .auth-card h1 {
      margin-top: 0;

      text-align: center;
    }


    .auth-card p {
      text-align: center;

      opacity: .7;
    }


    .input-group {
      margin-top: 18px;
    }


    .input-group label {
      display: block;

      margin-bottom: 7px;

      font-size: 14px;
    }


    .input-group input,
    .task-form input,
    .task-form select {

      width: 100%;

      padding: 12px;

      border:
        1px solid #343b4b;

      border-radius: 10px;

      background: #10131a;

      color: white;

      outline: none;
    }


    .input-group input:focus,
    .task-form input:focus,
    .task-form select:focus {
      border-color: #6c7cff;
    }


    .auth-buttons {
      display: flex;

      gap: 10px;

      margin-top: 20px;
    }


    .btn {
      border: 0;

      border-radius: 10px;

      padding: 11px 18px;

      background: #303747;

      color: white;
    }


    .btn-primary {
      background: #5865f2;
    }


    .btn-danger {
      background: #8f3442;
    }


    .btn:hover {
      opacity: .88;
    }


    #auth-message {
      margin-top: 15px;

      text-align: center;

      min-height: 22px;
    }


    /* ==============================
       Header
    ============================== */

    header {
      position: sticky;

      top: 0;

      z-index: 10;

      background:
        rgba(15,17,23,.95);

      border-bottom:
        1px solid #292f3d;

      backdrop-filter:
        blur(10px);
    }


    .header-inner {
      min-height: 70px;

      display: flex;

      align-items: center;

      justify-content: space-between;

      gap: 20px;
    }


    .logo {
      font-size: 20px;

      font-weight: bold;
    }


    .user-area {
      display: flex;

      align-items: center;

      gap: 12px;
    }


    /* ==============================
       主區域
    ============================== */

    main {
      padding: 30px 0 60px;
    }


    .page-title {
      margin-bottom: 25px;
    }


    .page-title h1 {
      margin-bottom: 5px;
    }


    .page-title p {
      margin-top: 0;

      opacity: .65;
    }


    /* ==============================
       卡片
    ============================== */

    .card {
      background: #181c26;

      border:
        1px solid #2c3342;

      border-radius: 16px;

      padding: 22px;

      margin-bottom: 22px;
    }


    .card h2 {
      margin-top: 0;
    }


    /* ==============================
       玩家資料
    ============================== */

    .player-grid {

      display: grid;

      grid-template-columns:
        repeat(3, 1fr);

      gap: 15px;
    }


    .stat-box {

      background: #10131a;

      border-radius: 12px;

      padding: 18px;

      text-align: center;
    }


    .stat-label {

      font-size: 13px;

      opacity: .6;

      margin-bottom: 7px;
    }


    .stat-value {

      font-size: 25px;

      font-weight: bold;
    }


    .exp-bar {

      height: 12px;

      margin-top: 18px;

      background: #0b0d12;

      border-radius: 20px;

      overflow: hidden;
    }


    #exp-progress {

      width: 0%;

      height: 100%;

      background:
        linear-gradient(
          90deg,
          #5865f2,
          #9b6cff
        );

      transition:
        width .3s ease;
    }


    #exp-text {

      text-align: center;

      margin-top: 8px;

      font-size: 13px;

      opacity: .7;
    }


    /* ==============================
       Summary
    ============================== */

    .summary-grid {

      display: grid;

      grid-template-columns:
        repeat(4, 1fr);

      gap: 12px;
    }


    /* ==============================
       表單
    ============================== */

    .task-form {

      display: grid;

      grid-template-columns:
        2fr 1fr 1fr;

      gap: 12px;

      align-items: end;
    }


    .form-item label {

      display: block;

      font-size: 13px;

      opacity: .7;

      margin-bottom: 6px;
    }


    .form-full {
      grid-column: 1 / -1;
    }


    .radio-area {

      display: flex;

      gap: 20px;

      align-items: center;

      margin-top: 15px;
    }


    .radio-area label {

      display: flex;

      gap: 5px;

      align-items: center;
    }


    #repeat-options {

      margin-top: 15px;

      padding: 15px;

      border-radius: 12px;

      background: #10131a;

      display: none;
    }


    #add-task-message {

      min-height: 20px;

      margin-top: 12px;
    }


    /* ==============================
       Filter
    ============================== */

    .filter-bar {

      display: flex;

      flex-wrap: wrap;

      gap: 8px;

      margin-bottom: 15px;
    }


    .filter-btn {

      padding: 8px 14px;

      border: 1px solid #343b4b;

      border-radius: 8px;

      background: #10131a;

      color: white;
    }


    .filter-btn.active {

      background: #5865f2;

      border-color: #5865f2;
    }


    /* ==============================
       任務
    ============================== */

    .task-item {

      background: #10131a;

      border:
        1px solid #272d3a;

      border-radius: 12px;

      padding: 14px;

      margin-bottom: 10px;
    }


    .task-item.completed {

      opacity: .55;
    }


    .task-main {

      display: flex;

      align-items: center;

      gap: 12px;
    }


    .task-checkbox input {

      width: 20px;

      height: 20px;
    }


    .task-content {

      flex: 1;

      min-width: 0;
    }


    .task-title {

      font-size: 16px;

      font-weight: bold;

      word-break: break-word;
    }


    .completed .task-title {

      text-decoration:
        line-through;
    }


    .task-meta {

      display: flex;

      flex-wrap: wrap;

      gap: 7px;

      margin-top: 7px;

      font-size: 12px;

      opacity: .65;
    }


    .task-meta span {

      background: #202532;

      padding: 4px 7px;

      border-radius: 6px;
    }


    .task-actions {

      display: flex;

      gap: 5px;
    }


    .task-actions button {

      border: 0;

      background: #252b38;

      color: white;

      border-radius: 7px;

      padding: 7px 9px;
    }


    .empty-state {

      padding: 35px;

      text-align: center;

      opacity: .5;
    }


    /* ==============================
       任務管理
    ============================== */

    .managed-task-item {

      display: flex;

      align-items: center;

      justify-content: space-between;

      gap: 15px;

      background: #10131a;

      border:
        1px solid #272d3a;

      border-radius: 12px;

      padding: 15px;

      margin-bottom: 10px;
    }


    .managed-task-item button {

      border: 0;

      background: #7d3040;

      color: white;

      padding: 8px 10px;

      border-radius: 8px;
    }


    /* ==============================
       每日收尾 / 今日結算
    ============================== */

    .wrapup-btn.selected {

      background: #5865f2;

      box-shadow:
        0 0 0 2px rgba(155,108,255,.45);
    }


    .report-card {

      background: #10131a;

      border:
        1px solid #272d3a;

      border-radius: 12px;

      padding: 18px;
    }


    .report-title {

      font-weight: bold;

      margin-bottom: 14px;
    }


    .report-grid {

      display: grid;

      grid-template-columns:
        auto 1fr;

      gap: 10px 24px;

      align-items: center;
    }


    .report-label {

      opacity: .7;

      font-size: 14px;
    }


    .report-value {

      font-weight: bold;
    }


    .report-rate {

      margin-top: 16px;

      padding-top: 14px;

      border-top:
        1px solid #272d3a;

      font-size: 18px;

      font-weight: bold;
    }


    .report-note {

      margin-top: 10px;

      font-size: 12px;

      opacity: .55;
    }


    /* ==============================
       RWD
    ============================== */

    @media (max-width: 800px) {

      .player-grid,
      .summary-grid {

        grid-template-columns:
          repeat(2, 1fr);

      }


      .task-form {

        grid-template-columns:
          1fr;

      }

    }


    @media (max-width: 500px) {

      .player-grid,
      .summary-grid {

        grid-template-columns:
          1fr;

      }


      .header-inner {

        flex-direction: column;

        padding: 12px 0;

      }


      .task-main {

        align-items: flex-start;

      }

    }

  </style>

</head>


<body>


<!-- ==================================================
     登入區
================================================== -->

<section id="auth-section">

  <div class="auth-card">

    <h1>⚔️ 神級人生逆襲系統</h1>

    <p>
      登入你的 RPG 人生系統
    </p>


    <div class="input-group">

      <label for="email">
        Email
      </label>

      <input
        type="email"
        id="email"
        placeholder="輸入 Email"
        autocomplete="email"
      >

    </div>


    <div class="input-group">

      <label for="password">
        密碼
      </label>

      <input
        type="password"
        id="password"
        placeholder="輸入密碼"
        autocomplete="current-password"
      >

    </div>


    <div class="auth-buttons">

      <button
        class="btn btn-primary"
        onclick="login()"
      >
        🔐 登入
      </button>


      <button
        class="btn"
        onclick="register()"
      >
        ✨ 註冊
      </button>

    </div>


    <div id="auth-message"></div>

  </div>

</section>



<!-- ==================================================
     APP
================================================== -->

<main
  id="app-section"
  style="display:none;"
>


  <!-- ==============================
       Header
  ============================== -->

  <header>

    <div class="container header-inner">

      <div class="logo">
        ⚔️ 神級人生逆襲系統
      </div>


      <div class="user-area">

        <span>
          👤
          <span id="username">
            玩家
          </span>
        </span>


        <button
          class="btn btn-danger"
          onclick="logout()"
        >
          登出
        </button>

      </div>

    </div>

  </header>



  <div class="container">


    <!-- ==============================
         標題
    ============================== -->

    <div class="page-title">

      <h1>
        🎮 今日冒險
      </h1>

      <p>
        今天也要完成主線任務。
      </p>

    </div>



    <!-- ==============================
         玩家資訊
    ============================== -->

    <section class="card">

      <h2>
        🧙 玩家狀態
      </h2>


      <div class="player-grid">


        <div class="stat-box">

          <div class="stat-label">
            等級
          </div>

          <div
            class="stat-value"
            id="player-level"
          >
            1
          </div>

        </div>


        <div class="stat-box">

          <div class="stat-label">
            經驗值
          </div>

          <div
            class="stat-value"
            id="player-exp"
          >
            0
          </div>

        </div>


        <div class="stat-box">

          <div class="stat-label">
            金幣
          </div>

          <div
            class="stat-value"
            id="player-gold"
          >
            100
          </div>

        </div>


      </div>


      <div class="exp-bar">

        <div
          id="exp-progress"
        ></div>

      </div>


      <div id="exp-text">
        0 / 100
      </div>

    </section>



    <!-- ==============================
         今日統計
    ============================== -->

    <section class="card">

      <h2>
        📊 今日統計
      </h2>


      <div class="summary-grid">


        <div class="stat-box">

          <div class="stat-label">
            今日任務
          </div>

          <div
            class="stat-value"
            id="daily-task-count"
          >
            0
          </div>

        </div>


        <div class="stat-box">

          <div class="stat-label">
            完成率
          </div>

          <div
            class="stat-value"
            id="completion-rate"
          >
            0%
          </div>

        </div>


        <div class="stat-box">

          <div class="stat-label">
            今日 EXP
          </div>

          <div
            class="stat-value"
            id="today-exp"
          >
            0
          </div>

        </div>


        <div class="stat-box">

          <div class="stat-label">
            今日金幣
          </div>

          <div
            class="stat-value"
            id="today-gold"
          >
            0
          </div>

        </div>


      </div>

    </section>



    <!-- ==============================
         新增任務
    ============================== -->

    <section class="card">

      <h2>
        ➕ 新增任務
      </h2>


      <div class="task-form">


        <div class="form-item">

          <label>
            任務名稱
          </label>

          <input
            type="text"
            id="new-task-title"
            placeholder="例如：完成多益 Part 5"
          >

        </div>


        <div class="form-item">

          <label>
            分類
          </label>

          <select
            id="new-task-category"
          >

            <option value="study">
              學習
            </option>

            <option value="toeic">
              多益
            </option>

            <option value="focus">
              專注
            </option>

            <option value="health">
              健康
            </option>

            <option value="survival">
              生存整理
            </option>

            <option value="personal">
              個人生活
            </option>

            <option value="daily">
              每日收尾
            </option>

            <option value="random">
              隨機自律
            </option>

          </select>

        </div>


        <div class="form-item">

          <label>
            難度
          </label>

          <select
            id="new-task-difficulty"
          >

            <option value="easy">
              簡單
            </option>

            <option
              value="normal"
              selected
            >
              普通
            </option>

            <option value="hard">
              困難
            </option>

            <option value="epic">
              史詩
            </option>

          </select>

        </div>


        <div class="form-full">

          <div class="radio-area">

            <strong>
              任務類型：
            </strong>


            <label>

              <input
                type="radio"
                name="new-task-repeat"
                value="once"
                checked
                onchange="updateRepeatUI()"
              >

              單次任務

            </label>


            <label>

              <input
                type="radio"
                name="new-task-repeat"
                value="repeat"
                onchange="updateRepeatUI()"
              >

              重複任務

            </label>

          </div>


          <div
            id="repeat-options"
          >

            <div class="task-form">


              <div class="form-item">

                <label>
                  重複方式
                </label>

                <select
                  name="repeat-type"
                  onchange="updateRepeatUI()"
                >

                  <option value="daily">
                    每天
                  </option>

                  <option value="weekly">
                    每週
                  </option>

                </select>

              </div>


              <div
                class="form-item"
                id="repeat-day-item"
                style="display:none;"
              >

                <label>
                  星期
                </label>

                <select
                  name="repeat-day"
                >

                  <option value="1">
                    星期一
                  </option>

                  <option value="2">
                    星期二
                  </option>

                  <option value="3">
                    星期三
                  </option>

                  <option value="4">
                    星期四
                  </option>

                  <option value="5">
                    星期五
                  </option>

                  <option value="6">
                    星期六
                  </option>

                  <option value="7">
                    星期日
                  </option>

                </select>

              </div>


              <div class="form-item">

                <label>
                  結束日期
                </label>

                <input
                  type="date"
                  id="repeat-end-date"
                >

              </div>


            </div>

          </div>

        </div>


        <div class="form-full">

          <button
            class="btn btn-primary"
            onclick="addTask()"
          >
            ➕ 建立任務
          </button>

        </div>


      </div>


      <div id="add-task-message"></div>

    </section>



    <!-- ==============================
         今日任務
    ============================== -->

    <section class="card">

      <h2>
        ⚔️ 今日任務
      </h2>


      <div class="filter-bar">


        <button
          class="filter-btn active"
          onclick="filterTasks('all', this)"
        >
          全部
        </button>


        <button
          class="filter-btn"
          onclick="filterTasks('uncompleted', this)"
        >
          未完成
        </button>


        <button
          class="filter-btn"
          onclick="filterTasks('completed', this)"
        >
          已完成
        </button>


      </div>


      <div id="task-list">

        <div class="empty-state">
          載入中...
        </div>

      </div>

    </section>



    <!-- ==============================
         任務管理
    ============================== -->

    <section
      class="card task-management-card"
    >

      <h2>
        🗂️ 任務管理
      </h2>


      <p
        style="
          opacity:0.7;
          margin-top:-5px;
        "
      >
        管理你的所有任務與重複任務設定
      </p>


      <div class="filter-bar">


        <button
          class="filter-btn active"
          onclick="filterManagedTasks('all', this)"
        >
          全部
        </button>


        <button
          class="filter-btn"
          onclick="filterManagedTasks('once', this)"
        >
          單次
        </button>


        <button
          class="filter-btn"
          onclick="filterManagedTasks('repeat', this)"
        >
          重複
        </button>


      </div>


      <button
        class="btn btn-danger"
        onclick="clearManagementList()"
      >
        🗑️ 清空所有任務
      </button>


      <div
        id="task-management-list"
        style="margin-top:15px;"
      >

        <div class="empty-state">
          載入中...
        </div>

      </div>

    </section>



    <!-- ==============================
         每日收尾
    ============================== -->

    <section class="card">

      <h2>
        🌙 每日收尾
      </h2>


      <p style="opacity:.7;">
        今天完成了多少？明天要繼續什麼？
      </p>


      <div
        style="
          display:flex;
          gap:10px;
          flex-wrap:wrap;
        "
      >

        <button
          class="btn wrapup-btn"
          data-rating="good"
          onclick="dailyWrapUp('good')"
        >
          ⭐ 今天表現不錯
        </button>


        <button
          class="btn wrapup-btn"
          data-rating="normal"
          onclick="dailyWrapUp('normal')"
        >
          🙂 普通的一天
        </button>


        <button
          class="btn wrapup-btn"
          data-rating="bad"
          onclick="dailyWrapUp('bad')"
        >
          🔥 明天重新開始
        </button>

      </div>


      <div
        id="daily-wrapup-message"
        style="margin-top:15px;"
      ></div>

    </section>


  </div>

</main>



<!-- ==================================================
     Supabase CDN
================================================== -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<!-- ==================================================
     你的 JS
================================================== -->

<script src="script.js"></script>


</body>

</html>
