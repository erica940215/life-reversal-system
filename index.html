<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>神級人生逆襲系統</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

  <!-- ==================================================
       登入
  ================================================== -->

  <section
    class="card"
    id="auth-section"
    style="margin-bottom: 20px;"
  >

    <h2>🔐 玩家登入</h2>

    <div
      id="auth-message"
      style="margin-bottom: 12px;"
    >
      尚未登入
    </div>


    <div id="auth-form">

      <input
        type="email"
        id="auth-email"
        placeholder="Email"
        autocomplete="email"
        style="
          width: 100%;
          box-sizing: border-box;
          margin-bottom: 10px;
          padding: 12px;
        "
      >


      <input
        type="password"
        id="auth-password"
        placeholder="密碼（至少 6 碼）"
        autocomplete="current-password"
        style="
          width: 100%;
          box-sizing: border-box;
          margin-bottom: 10px;
          padding: 12px;
        "
      >


      <div
        style="
          display: flex;
          gap: 10px;
          flex-wrap: wrap;
        "
      >

        <button
          type="button"
          onclick="registerUser()"
        >
          📝 註冊
        </button>


        <button
          type="button"
          onclick="loginUser()"
        >
          🔑 登入
        </button>

      </div>

    </div>


    <div
      id="logged-in-area"
      style="display: none;"
    >

      <div
        id="user-email"
        style="margin-bottom: 12px;"
      ></div>


      <button
        type="button"
        onclick="logoutUser()"
      >
        🚪 登出
      </button>

    </div>

  </section>



  <!-- ==================================================
       玩家資料
  ================================================== -->

  <header class="card header-card">

    <div class="system-title">
      ⚔️ 神級人生逆襲系統
    </div>


    <div class="stats-row">

      <span
        class="badge"
        id="player-level"
      >
        Lv.1
      </span>


      <span class="gold-text">

        💰 金幣：

        <span id="player-gold">
          100
        </span>

      </span>

    </div>


    <div class="exp-container">

      <div
        class="exp-bar"
        id="exp-bar"
        style="width: 50%;"
      ></div>

    </div>


    <div class="exp-text">

      <span id="current-exp">
        50
      </span>

      /

      <span id="required-exp">
        100
      </span>

      EXP

    </div>

  </header>



  <!-- ==================================================
       今日進度
  ================================================== -->

  <section class="card daily-summary">

    <h2>📊 今日進度</h2>


    <div class="summary-grid">

      <div class="summary-item">

        <span class="summary-label">
          任務完成
        </span>

        <strong id="completed-count">
          0 / 0
        </strong>

      </div>


      <div class="summary-item">

        <span class="summary-label">
          完成率
        </span>

        <strong id="summary-rate">
          0%
        </strong>

      </div>


      <div class="summary-item">

        <span class="summary-label">
          今日 EXP
        </span>

        <strong id="today-exp">
          +0
        </strong>

      </div>


      <div class="summary-item">

        <span class="summary-label">
          今日金幣
        </span>

        <strong id="today-gold">
          +0
        </strong>

      </div>

    </div>

  </section>



  <!-- ==================================================
       任務
  ================================================== -->

  <section class="card task-card">

    <h2>📜 今日任務</h2>



    <!-- ==================================================
         新增任務
    ================================================== -->

    <div
      class="add-task-box"
      style="
        margin-bottom: 20px;
        padding: 15px;
        border: 1px solid rgba(255,255,255,0.15);
        border-radius: 12px;
      "
    >

      <h3 style="margin-top: 0;">
        ➕ 新增任務
      </h3>


      <!-- 任務名稱 -->

      <input
        type="text"
        id="new-task-title"
        placeholder="輸入新任務，例如：背 TOEIC 單字 20 個"
        style="
          width: 100%;
          box-sizing: border-box;
          margin-bottom: 10px;
          padding: 12px;
        "
      >


      <!-- 分類 / 難度 -->

      <div
        style="
          display: flex;
          gap: 10px;
          flex-wrap: wrap;
          margin-bottom: 15px;
        "
      >

        <select
          id="new-task-category"
          style="
            padding: 10px;
            flex: 1;
            min-width: 130px;
          "
        >

          <option value="study">
            📚 學習
          </option>

          <option value="toeic">
            🇬🇧 多益
          </option>

          <option value="focus">
            🎯 專注
          </option>

          <option value="health">
            ❤️ 健康
          </option>

        </select>


        <select
          id="new-task-difficulty"
          style="
            padding: 10px;
            flex: 1;
            min-width: 130px;
          "
        >

          <option value="easy">
            🟢 簡單
          </option>

          <option
            value="normal"
            selected
          >
            🔵 普通
          </option>

          <option value="hard">
            🟣 困難
          </option>

        </select>

      </div>



      <!-- ==================================================
           是否重複
      ================================================== -->

      <div
        style="
          margin-bottom: 15px;
          padding: 12px;
          border-radius: 10px;
          background: rgba(255,255,255,0.04);
        "
      >

        <div
          style="
            font-weight: bold;
            margin-bottom: 10px;
          "
        >
          🔁 重複設定
        </div>


        <label
          style="
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-right: 15px;
          "
        >

          <input
            type="radio"
            name="new-task-repeat"
            value="none"
            checked
            onchange="toggleRepeatSettings()"
          >

          不重複

        </label>


        <label
          style="
            display: inline-flex;
            align-items: center;
            gap: 6px;
          "
        >

          <input
            type="radio"
            name="new-task-repeat"
            value="repeat"
            onchange="toggleRepeatSettings()"
          >

          🔁 重複任務

        </label>



        <!-- ==================================================
             重複設定內容
        ================================================== -->

        <div
          id="repeat-settings"
          style="
            display: none;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid rgba(255,255,255,0.1);
          "
        >

          <!-- 重複方式 -->

          <div
            style="
              margin-bottom: 15px;
            "
          >

            <div
              style="
                font-weight: bold;
                margin-bottom: 8px;
              "
            >
              重複方式
            </div>


            <label
              style="
                display: inline-flex;
                align-items: center;
                gap: 6px;
                margin-right: 15px;
              "
            >

              <input
                type="radio"
                name="repeat-type"
                value="daily"
                checked
                onchange="toggleWeekdaySettings()"
              >

              每日

            </label>


            <label
              style="
                display: inline-flex;
                align-items: center;
                gap: 6px;
              "
            >

              <input
                type="radio"
                name="repeat-type"
                value="weekly"
                onchange="toggleWeekdaySettings()"
              >

              每週

            </label>

          </div>



          <!-- ==================================================
               星期選擇
          ================================================== -->

          <div
            id="weekday-settings"
            style="
              display: none;
              margin-bottom: 15px;
            "
          >

            <div
              style="
                font-weight: bold;
                margin-bottom: 8px;
              "
            >
              選擇星期
            </div>


            <div
              style="
                display: flex;
                flex-wrap: wrap;
                gap: 8px;
              "
            >

              <label>
                <input
                  type="checkbox"
                  name="repeat-day"
                  value="1"
                >
                一
              </label>


              <label>
                <input
                  type="checkbox"
                  name="repeat-day"
                  value="2"
                >
                二
              </label>


              <label>
                <input
                  type="checkbox"
                  name="repeat-day"
                  value="3"
                >
                三
              </label>


              <label>
                <input
                  type="checkbox"
                  name="repeat-day"
                  value="4"
                >
                四
              </label>


              <label>
                <input
                  type="checkbox"
                  name="repeat-day"
                  value="5"
                >
                五
              </label>


              <label>
                <input
                  type="checkbox"
                  name="repeat-day"
                  value="6"
                >
                六
              </label>


              <label>
                <input
                  type="checkbox"
                  name="repeat-day"
                  value="7"
                >
                日
              </label>

            </div>

          </div>



          <!-- ==================================================
               結束日期
          ================================================== -->

          <div>

            <label
              for="repeat-end-date"
              style="
                display: block;
                font-weight: bold;
                margin-bottom: 8px;
              "
            >
              結束日期
            </label>


            <input
              type="date"
              id="repeat-end-date"
              style="
                padding: 10px;
                max-width: 220px;
                box-sizing: border-box;
              "
            >


            <div
              style="
                margin-top: 6px;
                font-size: 13px;
                opacity: 0.7;
              "
            >
              不填代表持續重複，直到你關閉任務。
            </div>

          </div>

        </div>

      </div>



      <!-- ==================================================
           新增按鈕
      ================================================== -->

      <button
        type="button"
        id="add-task-button"
        onclick="addTask()"
      >
        ➕ 新增任務
      </button>


      <div
        id="add-task-message"
        style="margin-top: 10px;"
      ></div>

    </div>



    <!-- ==================================================
         篩選
    ================================================== -->

    <div class="task-filter">

      <button
        class="filter-btn active"
        onclick="filterTasks('all', this)"
      >
        全部
      </button>


      <button
        class="filter-btn"
        onclick="filterTasks('study', this)"
      >
        📚 學習
      </button>


      <button
        class="filter-btn"
        onclick="filterTasks('toeic', this)"
      >
        🇬🇧 多益
      </button>


      <button
        class="filter-btn"
        onclick="filterTasks('focus', this)"
      >
        🎯 專注
      </button>


      <button
        class="filter-btn"
        onclick="filterTasks('health', this)"
      >
        ❤️ 健康
      </button>

    </div>



    <!-- ==================================================
         任務列表
    ================================================== -->

    <ul class="task-list">

    </ul>

  </section>



  <!-- ==================================================
       完成率
  ================================================== -->

  <footer class="card rate-card">

    <div class="rate-title">

      今日完成率：

      <span id="rate-text">
        0%
      </span>

    </div>


    <div class="rate-container">

      <div
        class="rate-bar"
        id="rate-bar"
        style="width: 0%;"
      ></div>

    </div>

  </footer>

</div>



<!-- ==================================================
     Supabase
================================================== -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<!-- ==================================================
     JavaScript
================================================== -->

<script src="script.js"></script>

</body>
</html>
